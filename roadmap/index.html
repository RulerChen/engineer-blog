<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="QrdRbPEcOsJJ_kfRVewqfwR6GjPcRf0UVgRb85I-5fc" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/roadmaps/index.json" as="fetch" crossorigin />
    <script>
      // A deep link's own roadmap, fetched alongside the bundle instead of after it; same path as roadmapFile in src/shared/roadmap.ts.
      const topic = new URLSearchParams(location.search).get("topic");
      if (topic) {
        const link = Object.assign(document.createElement("link"), {
          rel: "preload",
          as: "fetch",
          crossOrigin: "anonymous",
          href: `%BASE_URL%roadmaps/${encodeURIComponent(topic)}.json`,
        });
        document.head.append(link);
      }
    </script>
    <title>Awesome Engineering Roadmaps</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

for Fraud Detection\",\"excerpt\":{\"nodeType\":\"document\",\"data\":{},\"content\":[{\"nodeType\":\"paragraph\",\"data\":{},\"content\":[{\"nodeType\":\"text\",\"value\":\"TL;DR: When a new fraud pattern hits, figuring out which signals already exist in your data — and what new ones you should build — is a manual, time-consuming process. We built a search tool over our internal feature store and event logs that lets fraud analysts describe a new scam in plain English and quickly discover relevant signals.\",\"marks\":[],\"data\":{}}]}]},\"thumbnail\":{\"defaultImage\":{\"url\":\"//images.ctfassets.net/sygt3q11s4a9/7DSJMlcUiOOS06olpdd12j/aa58771d086fd88cab5da171cce9828b/Screenshot_2026-01-21_at_2.46.12â__PM.png\"}},\"authors\":[{\"contentTypeId\":\"CDXV2_Author\",\"id\":\"5eLVpOf6sCMCmHXfl5UcmX\",\"componentId\":\"Travis Li author\",\"name\":\"Travis Li\"},{\"contentTypeId\":\"CDXV2_Author\",\"id\":\"456aJHMslXI3TDRXkDyJ2y\",\"componentId\":\"Jeffrey Zhou author\",\"name\":\"Jeffrey Zhou\"},{\"contentTypeId\":\"CDXV2_Author\",\"id\":\"6PeevPupbrr8ulRZKKNm9\",\"componentId\":\"Shuo Deng author\",\"name\":\"Shuo Deng\"}],\"tags\":[{\"contentTypeId\":\"CDXV2_Tag\",\"id\":\"6Hb3mkYoJuMMSfpGYKv7aD\",\"componentId\":\"engineeringTag\",\"name\":\"Engineering\",\"link\":\"/blog/landing/engineering\"}]}},{\"contentTypeId\":\"page\",\"id\":\"5Cr7GBaCfqOqsP83m2ZRC1\",\"title\":\"Automating Figma-to-Code at Coinbase\",\"slug\":\"/blog/automating-figma-to-code-at-coinbase\",\"publicationDate\":\"2026-06-03T00:00-04:00\",\"content\":{\"headline\":\"Automating Figma-to-Code at Coinbase\",\"excerpt\":{\"data\":{},\"content\":[{\"data\":{},\"content\":[{\"data\":{},\"marks\":[],\"value\":\"TL;DR: Turning Figma designs into production-ready code is a repetitive part of building software. To address this, we built an AI agent that reads Figma screenshots and writes the corresponding production code. Our first pilot took four days, where the same feature normally takes two to four weeks. The setup has three parts: a reference implementation the agent studies, a rules document that pins down exactly what to generate, and prompt templates that engineers fill in and run. We've published all of it to our internal skills platform so any team can pick it up.\",\"nodeType\":\"text\"}],\"nodeType\":\"paragraph\"}],\"nodeType\":\"document\"},\"thumbnail\":{\"defaultImage\":{\"url\":\"//images.ctfassets.net/sygt3q11s4a9/7aSSlkqLY90f17uTaTZsuG/4f647bf31fa0c8ea40f423d0fd5698d6/coinbase.png\"}},\"authors\":[{\"contentTypeId\":\"CDXV2_Author\",\"id\":\"g6DK5mirp2hZKLRYhZ3yU\",\"componentId\":\"Matheus Moreira\",\"name\":\"Matheus Moreira\"},{\"contentTypeId\":\"CDXV2_Author\",\"id\":\"75FPavQVmRZnxu95x6Y1Js\",\"componentId\":\"Marvin Mathew\",\"name\":\"Marvin Mathew\"}],\"tags\":[{\"contentTypeId\":\"CDXV2_Tag\",\"id\":\"6Hb3mkYoJuMMSfpGYKv7aD\",\"componentId\":\"engineeringTag\",\"name\":\"Engineering\",\"link\":\"/blog/landing/engineering\"}]}},{\"contentTypeId\":\"page\",\"id\":\"718FkJCDiywtnqhe2roVBy\",\"title\":\"A postmortem of our May 7, 2026 outage\",\"slug\":\"/blog/a-postmortem-of-our-may-7-2026-outage\",\"publicationDate\":\"2026-06-01T00:00-04:00\",\"content\":{\"headline\":\"A postmortem of our May 7, 2026 outage\",\"excerpt\":{\"data\":{},\"content\":[{\"data\":{},\"content\":[{\"data\":{},\"marks\":[],\"value\":\"TL;DR: On May 7, 2026, an AWS thermal event triggered a Coinbase outage. Recovery was delayed by a matching engine locked to the failed zone and a silent failure in AWS's managed Kafka service. Moving forward, we are improving our cross-zone standbys for our low-latency exchange and updating Kafka infrastructure.\",\"nodeType\":\"text\"}],\"nodeType\":\"paragraph\"}],\"nodeType\":\"document\"},\"thumbnail\":{\"defaultImage\":{\"url\":\"//images.ctfassets.net/sygt3q11s4a9/7aSSlkqLY90f17uTaTZsuG/4f647bf31fa0c8ea40f423d0fd5698d6/coinbase.png\"}},\"authors\":[{\"contentTypeId\":\"CDXV2_Author\",\"id\":\"66fSsBkHtmsiiItrqumkax\",\"compone
